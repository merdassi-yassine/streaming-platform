<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Streaming Platform{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #141414; color: #f5f5f5; }
        header { background: #000; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        header h1 { margin: 0; font-size: 1.5rem; }
        header h1 a { color: #e50914; text-decoration: none; }
        nav form { display: inline-flex; gap: 0.5rem; margin-left: 1rem; }
        nav input, nav select, button { padding: 0.4rem 0.6rem; border: 1px solid #333; background: #222; color: #fff; border-radius: 4px; }
        button { background: #e50914; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #f40612; }
        main { padding: 2rem; max-width: 1000px; margin: auto; }
        a { color: #e50914; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { background: #1f1f1f; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #333; }
        th { background: #222; }
        .alert-success { background: #1c3b2b; color: #4ade80; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; }
        .alert-error { background: #3f1d1d; color: #f87171; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; }
        .badge { background: #333; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'home' %}">StreamingPlatform</a></h1>
        <nav>
            <form action="" method="get" onsubmit="event.preventDefault(); const g = document.getElementById('genre-input').value; if(g) window.location.href='/genres/' + encodeURIComponent(g) + '/';">
                <input type="text" id="genre-input" placeholder="Genre (ex: Action)" required>
                <button type="submit">Genre</button>
            </form>
            <form action="" method="get" onsubmit="event.preventDefault(); const u = document.getElementById('user-input').value; if(u) window.location.href='/users/' + encodeURIComponent(u) + '/history/';">
                <input type="text" id="user-input" placeholder="ID Utilisateur (UUID)" required>
                <button type="submit">Historique</button>
            </form>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
